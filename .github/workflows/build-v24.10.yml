name: Build v24.10

on:
  workflow_dispatch:
    inputs:
      profile:
        description: '固件配置'
        required: true
        default: 'Plus'
        type: choice
        options:
          - 'Plus'
          - 'Plus+Docker'
      lan_ip:
        description: 'LAN IP（留空使用默认 10.0.0.252）'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: build-v24.10
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/build-openwrt.yml
    with:
      branch: v24.10
      profile: ${{ inputs.profile }}
      lan_ip: ${{ inputs.lan_ip }}
    secrets: inherit
