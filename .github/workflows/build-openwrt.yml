name: Build OpenWrt

on:
  workflow_call:
    inputs:
      branch:
        description: "分支标签 (v24.10 或 v25.12)"
        required: true
        type: string
      profile:
        description: "设备配置名称"
        required: true
        type: string
      lan_ip:
        description: "LAN IP 地址"
        required: false
        type: string

permissions:
  contents: write

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  CONFIG_FILE: configs/x86_64_${{ inputs.profile }}.config
  DIY_SCRIPT: scripts/diy.sh
  CLASH_KERNEL: amd64
  CACHE_TOOLCHAIN: true
  UPLOAD_RELEASE: true
  DEFAULT_IP: 10.0.0.252
  TZ: Asia/Shanghai

jobs:
  build:
    name: Build ${{ inputs.branch }} / ${{ inputs.profile }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      # 分支标签 -> ImmortalWrt 上游分支映射
      # v24.10 -> openwrt-24.10（稳定）  v25.12 -> openwrt-25.12（稳定）
      - name: Resolve Source Branch
        id: resolve
        run: |
          case "${{ inputs.branch }}" in
            v24.10) REF="openwrt-24.10" ;;
            v25.12) REF="openwrt-25.12" ;;
            *)      REF="${{ inputs.branch }}" ;;
          esac
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "REPO_BRANCH=$REF" >> "$GITHUB_ENV"
          echo "📌 分支标签 ${{ inputs.branch }} → 上游分支 $REF"

      - name: Check Server Performance
        run: |
          echo "======================================"
          echo "CPU 信息:"
          nproc
          lscpu | grep "Model name" || true
          echo "--------------------------------------"
          echo "内存信息:"
          free -h
          echo "--------------------------------------"
          echo "硬盘信息:"
          df -hT
          echo "======================================"

      - name: Initialize Environment
        run: |
          echo "清理 Docker..."
          sudo systemctl stop docker.socket docker.service 2>/dev/null || true
          sudo apt-get -y remove --purge docker* containerd* 2>/dev/null || true
          echo "清理 .NET..."
          sudo rm -rf /usr/share/dotnet /opt/ghc 2>/dev/null || true
          echo "清理 Android SDK..."
          sudo rm -rf /usr/local/lib/android 2>/dev/null || true
          echo "清理 apt 缓存..."
          sudo apt-get clean
          sudo apt-get -y autoremove --purge
          echo "安装编译依赖..."
          sudo apt-get update
          sudo apt-get install -y \
            aria2 autoconf automake binutils bison bzip2 ccache clang cmake cpio \
            curl device-tree-compiler flex gawk gcc git gperf help2man libelf-dev \
            libglib2.0-dev libtool liblzma-dev libncurses-dev libssl-dev lz4 m4 \
            make mercurial genisoimage msmtp ninja-build p7zip-full patch pkgconf \
            python3 python3-dev python3-pip python3-setuptools rsync squashfs-tools \
            texinfo upx-ucl unzip uuid-dev vim wget xxd zlib1g-dev

      - name: Optimize Disk Space
        uses: sclsyin/disk-space-optimizer-ghaction@main

      - name: Create Swap Space
        run: |
          echo "创建 swap（不迁移工作区，避免 GITHUB_WORKSPACE 路径失效）..."
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo dd if=/dev/zero of=/swapfile bs=1M count=8192 status=progress || true
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          echo "swap 状态:"; swapon --show || true

      - name: Disk Space Status
        run: |
          echo "======================================"
          echo "磁盘优化后的空间状态:"
          df -hT
          echo "======================================"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone Source Code
        run: |
          set -e
          cd $GITHUB_WORKSPACE
          git clone $REPO_URL -b $REPO_BRANCH openwrt
          cd openwrt
          echo "OPENWRT_PATH=$GITHUB_WORKSPACE/openwrt" >> $GITHUB_ENV
          echo "COMMIT_AUTHOR=$(git log -1 --format='%an')" >> $GITHUB_ENV
          echo "COMMIT_DATE=$(git log -1 --format='%ad' --date=format:'%Y-%m-%d %H:%M:%S')" >> $GITHUB_ENV
          echo "COMMIT_MESSAGE=$(git log -1 --format='%s')" >> $GITHUB_ENV
          echo "COMMIT_HASH=$(git log -1 --format='%H')" >> $GITHUB_ENV
          echo "源码克隆完成: $REPO_URL ($REPO_BRANCH)"
          echo "最新提交: $COMMIT_HASH"

      - name: Generate Variables
        run: |
          cd $GITHUB_WORKSPACE/openwrt
          echo "复制配置文件..."
          cp $GITHUB_WORKSPACE/$CONFIG_FILE .config
          make defconfig
          echo "提取设备信息..."
          echo "DEVICE_TARGET=$(grep CONFIG_TARGET_BOARD= .config | cut -d'"' -f2)" >> $GITHUB_ENV
          echo "DEVICE_SUBTARGET=$(grep CONFIG_TARGET_SUBTARGET= .config | cut -d'"' -f2)" >> $GITHUB_ENV
          echo "BRANCH_SHORT=${{ inputs.branch }}" >> $GITHUB_ENV
          echo "DEVICE_TARGET: ${{ env.DEVICE_TARGET }}"
          echo "DEVICE_SUBTARGET: ${{ env.DEVICE_SUBTARGET }}"

      - name: Determine LAN IP
        run: |
          LAN_IP="${{ inputs.lan_ip }}"
          if [ -z "$LAN_IP" ]; then
            echo "未从输入获取 LAN IP，尝试从 init-settings.sh 提取..."
            INIT_SCRIPT="$GITHUB_WORKSPACE/scripts/init-settings.sh"
            if [ -f "$INIT_SCRIPT" ]; then
              LAN_IP=$(grep -oE '([0-9]{1,3}\.){3}[0-9]{1,3}' "$INIT_SCRIPT" | head -1)
            fi
          fi
          if [ -z "$LAN_IP" ]; then
            echo "未从 init-settings.sh 提取到 LAN IP，使用默认值..."
            LAN_IP="$DEFAULT_IP"
          fi
          echo "LAN_IP=$LAN_IP" >> $GITHUB_ENV
          echo "使用的 LAN IP: $LAN_IP"

      - name: Cache Toolchain
        uses: HiGarfield/cachewrtbuild@main
        with:
          prefix: ${{ github.workspace }}/openwrt
          mixkey: ${{ inputs.branch }}-${{ inputs.profile }}
          skip_sweep: true

      - name: Install Feeds
        run: |
          cd $GITHUB_WORKSPACE/openwrt
          echo "更新 feeds..."
          ./scripts/feeds update -a
          echo "安装 feeds..."
          ./scripts/feeds install -a

      - name: Load Custom Configuration
        run: |
          cd $GITHUB_WORKSPACE/openwrt
          echo "复制 files 目录..."
          if [ -d "$GITHUB_WORKSPACE/files" ]; then
            cp -r $GITHUB_WORKSPACE/files/* files/ 2>/dev/null || true
          fi
          echo "复制配置文件..."
          cp $GITHUB_WORKSPACE/$CONFIG_FILE .config
          echo "设置脚本执行权限..."
          chmod +x $GITHUB_WORKSPACE/scripts/*.sh
          echo "执行 DIY 脚本..."
          $GITHUB_WORKSPACE/$DIY_SCRIPT
          echo "预设 Clash 核心..."
          if [ -f "$GITHUB_WORKSPACE/scripts/preset-clash-core.sh" ]; then
            $GITHUB_WORKSPACE/scripts/preset-clash-core.sh
          fi
          echo "预设终端工具..."
          if [ -f "$GITHUB_WORKSPACE/scripts/preset-terminal-tools.sh" ]; then
            $GITHUB_WORKSPACE/scripts/preset-terminal-tools.sh
          fi
          echo "预设 AdGuard 核心..."
          if [ -f "$GITHUB_WORKSPACE/scripts/preset-adguard-core.sh" ]; then
            $GITHUB_WORKSPACE/scripts/preset-adguard-core.sh
          fi

      - name: Download DL Packages
        run: |
          cd $GITHUB_WORKSPACE/openwrt
          echo "生成最终配置..."
          make defconfig
          echo "下载 DL 包..."
          make download -j$(nproc)
          echo "清理空下载文件..."
          find dl -type f -size -1c -delete 2>/dev/null || true

      - name: Compile Firmware
        run: |
          cd $GITHUB_WORKSPACE/openwrt
          echo "创建 uci-defaults 目录..."
          mkdir -p files/etc/uci-defaults
          echo "复制 init-settings.sh..."
          if [ -f "$GITHUB_WORKSPACE/scripts/init-settings.sh" ]; then
            cp $GITHUB_WORKSPACE/scripts/init-settings.sh files/etc/uci-defaults/99-init-settings
            echo "设置 LAN IP: $LAN_IP"
            sed -i "s/[0-9]\{1,3\}\.[0-9]\{1,3\}\.[0-9]\{1,3\}\.[0-9]\{1,3\}/$LAN_IP/g" files/etc/uci-defaults/99-init-settings 2>/dev/null || true
          fi
          echo "开始编译固件..."
          make -j$(nproc) || make -j1 V=s
          echo "编译完成！"

      - name: Check Space Usage
        run: |
          echo "======================================"
          echo "编译后磁盘空间使用:"
          df -hT
          echo "======================================"

      - name: Organize Files
        run: |
          cd $GITHUB_WORKSPACE/openwrt/bin/targets/*/*
          echo "复制 .config 文件..."
          cp $GITHUB_WORKSPACE/openwrt/.config built.config
          echo "打包 IPK/APK 包文件..."
          mkdir -p packages
          find $GITHUB_WORKSPACE/openwrt/bin/packages \( -name "*.ipk" -o -name "*.apk" \) -exec cp {} packages/ \; 2>/dev/null || true
          if [ -n "$(ls -A packages 2>/dev/null)" ]; then
            tar -czf packages.tar.gz packages/
          fi
          echo "删除 buildinfo 文件..."
          rm -f *.buildinfo
          echo "提取内核版本..."
          KERNEL_VERSION=$(ls $GITHUB_WORKSPACE/openwrt/dl/linux-*.tar.* 2>/dev/null | sed -E 's#.*/linux-([0-9]+\.[0-9]+\.[0-9]+).*#\1#' | sort -V | tail -1)
          if [ -z "$KERNEL_VERSION" ]; then
            KERNEL_VERSION=$(grep -oE '^LINUX_VERSION-[0-9.]+' $GITHUB_WORKSPACE/openwrt/include/kernel-version.mk 2>/dev/null | tail -1 | sed 's/LINUX_VERSION-//')
          fi
          [ -z "$KERNEL_VERSION" ] && KERNEL_VERSION="unknown"
          echo "KERNEL_VERSION=$KERNEL_VERSION" >> $GITHUB_ENV
          echo "内核版本: $KERNEL_VERSION"
          echo "生成 SHA256 校验和（仅文件，忽略子目录）..."
          find . -maxdepth 1 -type f ! -name 'sha256sums' -print0 | xargs -0 -r sha256sum > sha256sums
          echo "整理完成的文件列表:"
          ls -lh

      - name: Upload To Artifact
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-${{ inputs.branch }}-${{ inputs.profile }}
          path: ${{ env.OPENWRT_PATH }}/bin/targets/*/*
          retention-days: 7

      - name: Upload To Release
        uses: ncipollo/release-action@v1
        with:
          tag: ImmortalWrt-${{ inputs.branch }}-${{ inputs.profile }}
          name: ImmortalWrt ${{ inputs.branch }} - ${{ inputs.profile }}
          body: |
            ## 📋 固件信息

            | 项目 | 内容 |
            |------|------|
            | **平台架构** | x86_64 |
            | **固件源码** | [immortalwrt](https://github.com/immortalwrt/immortalwrt) |
            | **分支标签** | `${{ inputs.branch }}` |
            | **上游分支** | `${{ steps.resolve.outputs.ref }}` |
            | **内核版本** | `${{ env.KERNEL_VERSION }}` |
            | **默认地址** | `${{ env.LAN_IP }}` |
            | **默认密码** | `password` |
            | **固件配置** | `${{ inputs.profile }}` |

            ## 📝 源码更新信息

            | 项目 | 内容 |
            |------|------|
            | **提交作者** | `${{ env.COMMIT_AUTHOR }}` |
            | **提交时间** | `${{ env.COMMIT_DATE }}` |
            | **提交信息** | `${{ env.COMMIT_MESSAGE }}` |
            | **提交哈希** | `${{ env.COMMIT_HASH }}` |

            ---

            > 🔄 本固件由 GitHub Actions 自动编译构建，如有问题请提 Issue 反馈。
          artifacts: ${{ env.OPENWRT_PATH }}/bin/targets/*/*
          allowUpdates: true
          makeLatest: true
