name: Build v25.12

on:
  workflow_dispatch:
    inputs:
      profile:
        description: '固件配置'
        required: true
        default: 'Plus'
        type: choice
        options:
          - 'Plus'
          - 'Plus+Docker'
      lan_ip:
        description: 'LAN IP（留空使用默认 10.0.0.252）'
        required: false
        default: ''
      lan_gateway:
        description: 'LAN 网关（留空使用默认 10.0.0.253）'
        required: false
        default: ''
      lan_netmask:
        description: 'LAN 子网掩码（留空使用默认 255.255.255.0）'
        required: false
        default: ''
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build-openwrt.yml
    with:
      branch: v25.12
      profile: ${{ inputs.profile || 'Plus' }}
      lan_ip: ${{ inputs.lan_ip }}
      lan_gateway: ${{ inputs.lan_gateway || '10.0.0.253' }}
      lan_netmask: ${{ inputs.lan_netmask || '255.255.255.0' }}
    secrets: inherit