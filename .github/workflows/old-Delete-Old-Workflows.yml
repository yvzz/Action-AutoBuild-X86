name: Delete Old Workflows

on:
  workflow_dispatch:
    inputs:
      retain_days:
        description: '保留最近几天的成功 Workflow（填 0 删除全部）'
        required: true
        type: number
        default: 7
      include_cancelled:
        description: '同时删除取消的 Workflow'
        required: true
        type: boolean
        default: true
  schedule:
    # 每周日 03:00 北京时间 (UTC 周六 19:00)
    - cron: '0 19 * * 6'

jobs:
  Cleaning:
    runs-on: ubuntu-24.04
    steps:
      - name: Delete Old Workflows
        uses: Mattraks/delete-workflow-runs@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          retain_days: ${{ inputs.retain_days || 7 }}
          keep_minimum_runs: ${{ inputs.retain_days || 7 }}
          delete_run_by_conclusion_pattern: ''

      - name: Delete Cancelled Workflows
        if: ${{ inputs.include_cancelled || true }}
        uses: Mattraks/delete-workflow-runs@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          retain_days: 0
          keep_minimum_runs: 0
          delete_run_by_conclusion_pattern: cancelled

      - name: Delete Old Releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          KEEP=5
          RELEASES=$(gh release list -R ${{ github.repository }} --limit 100 --json tagName,createdAt -q 'sort_by(.createdAt) | reverse | .['"$KEEP"':] | .[].tagName')
          for tag in $RELEASES; do
            echo "Deleting release: $tag"
            gh release delete "$tag" -R ${{ github.repository }} --yes --cleanup-tag
          done