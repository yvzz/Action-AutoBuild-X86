name: Schedule Build

on:
  workflow_dispatch:
    inputs:
      branch:
        description: '选择编译分支'
        required: true
        default: 'v24.10'
        type: choice
        options:
          - 'v24.10'   # ImmortalWrt openwrt-24.10（稳定版）
          - 'v25.12'   # ImmortalWrt openwrt-25.12（稳定版）
          - 'all'      # 两个分支都编译
      profile:
        description: '选择固件配置'
        required: true
        default: 'Plus'
        type: choice
        options:
          - 'Plus'
          - 'Plus+Docker'
      lan_ip:
        description: 'LAN IP 地址（留空使用配置默认值）'
        required: false
        default: ''
      lan_gateway:
        description: 'LAN 网关地址（留空使用默认 10.0.0.253）'
        required: false
        default: ''
      lan_netmask:
        description: 'LAN 子网掩码（留空使用默认 255.255.255.0）'
        required: false
        default: ''
      force_build:
        description: '无更新时继续编译（勾选后忽略更新检测，强制编译）'
        required: false
        default: false
        type: boolean
  schedule:
    # 每周六 00:00 北京时间（= UTC 周五 16:00）
    - cron: '0 16 * * 5'

permissions:
  contents: write

jobs:
  # ============================================================
  # Step 1: 检测源码是否有更新 + 生成动态 matrix
  #   - 定时触发：检测 v24.10 / v25.12 两个分支，仅编译「有更新」的分支
  #   - 手动触发：跳过检测，只编译用户选定的那一组
  # ============================================================
  check-update:
    name: Check Source Update
    runs-on: ubuntu-24.04
    outputs:
      has_update: ${{ steps.check.outputs.has_update }}
      build_matrix: ${{ steps.check.outputs.build_matrix }}
      updated: ${{ steps.check.outputs.updated }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check Branch Updates & Generate Matrix
        id: check
        env:
          EVENT: ${{ github.event_name }}
          IN_BRANCH: ${{ inputs.branch }}
          IN_PROFILE: ${{ inputs.profile }}
          IN_FORCE: ${{ inputs.force_build }}
        run: |
          set -euo pipefail

          # 分支标签 -> ImmortalWrt 上游分支
          src_ref() {
            case "$1" in
              v24.10) echo "openwrt-24.10" ;;
              v25.12) echo "openwrt-25.12" ;;
              *)      echo "$1" ;;
            esac
          }

          if [ "$EVENT" = "schedule" ]; then
            BRANCHES="v24.10 v25.12"
            PROFILES="Plus|Plus+Docker"
            MANUAL="false"
          else
            if [ "$IN_BRANCH" = "all" ]; then
              BRANCHES="v24.10 v25.12"
              ALL_MODE="true"
            else
              BRANCHES="$IN_BRANCH"
              ALL_MODE="false"
            fi
            PROFILES="$IN_PROFILE"
            MANUAL="true"
          fi

          # 强制编译开关：仅手动勾选 force_build 时生效（默认 false）
          FORCE="false"
          if [ "$MANUAL" = "true" ] && [ "${IN_FORCE:-false}" = "true" ]; then
            FORCE="true"
            echo "⚡ 已勾选「无更新时继续编译」，将忽略更新检测"
          fi

          UPDATED=""
          for B in $BRANCHES; do
            REF=$(src_ref "$B")
            REMOTE=$(git ls-remote https://github.com/immortalwrt/immortalwrt "refs/heads/$REF" | awk '{print $1}')
            MARKER=".github/last_commit/$B.txt"
            LAST=""
            [ -f "$MARKER" ] && LAST=$(tr -d '[:space:]' < "$MARKER")
            echo "🔍 $B（上游 $REF）: remote=${REMOTE:0:12} last=${LAST:0:12}"

            if [ "$FORCE" = "true" ]; then
              echo "  ⚡ 强制编译（忽略更新检测）"
              UPDATED="$UPDATED $B"
            elif [ -n "$REMOTE" ] && [ "$REMOTE" != "$LAST" ]; then
              echo "  ✅ 检测到更新"
              UPDATED="$UPDATED $B"
            else
              if [ "$MANUAL" = "true" ]; then
                echo "  ⏭️ 无更新，跳过（如需强制编译，请勾选「无更新时继续编译」）"
              else
                echo "  ⏭️ 无更新，跳过"
              fi
            fi
          done
          UPDATED="${UPDATED# }"

          # 动态 matrix：仅包含本次需要编译的组合
          MATRIX="["
          SEP=""
          if [ "${ALL_MODE:-false}" = "true" ]; then
            # all 模式：固定 v24.10/Plus + v25.12/Plus
            for COMBO in "v24.10 Plus" "v25.12 Plus"; do
              B=$(echo "$COMBO" | cut -d' ' -f1)
              P=$(echo "$COMBO" | cut -d' ' -f2)
              # 检查该分支是否在 UPDATED 列表中
              for U in $UPDATED; do
                if [ "$U" = "$B" ]; then
                  MATRIX="${MATRIX}${SEP}{\"branch\":\"${B}\",\"profile\":\"${P}\"}"
                  SEP=","
                fi
              done
            done
          else
            for B in $UPDATED; do
              for P in $(echo "$PROFILES" | tr '|' ' '); do
                MATRIX="${MATRIX}${SEP}{\"branch\":\"${B}\",\"profile\":\"${P}\"}"
                SEP=","
              done
            done
          fi
          MATRIX="${MATRIX}]"

          if [ "$MATRIX" = "[]" ]; then HAS="false"; else HAS="true"; fi

          echo "has_update=$HAS"      >> "$GITHUB_OUTPUT"
          echo "build_matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "updated=$UPDATED"     >> "$GITHUB_OUTPUT"

          echo ""
          echo "========================================"
          echo "有更新: $HAS"
          echo "待编译: ${UPDATED:-（无）}"
          echo "Matrix: $MATRIX"
          echo "========================================"

  # ============================================================
  # Step 1.5: 编译前冒烟测试（秒级，不联网）
  #   仅校验 scripts/diy.sh 的关键改动是否生效；失败则阻断后续编译
  # ============================================================
  smoke-test:
    name: DIY 冒烟测试
    needs: check-update
    if: needs.check-update.outputs.has_update == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: 编译前冒烟测试
        run: |
          bash scripts/tests/diy-smoke.sh

  # ============================================================
  # Step 2: 有更新则触发编译（动态 matrix，复用 build-openwrt.yml）
  # ============================================================
  build:
    name: Build ${{ matrix.branch }} / ${{ matrix.profile }}
    needs: [check-update, smoke-test]
    if: needs.check-update.outputs.has_update == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.check-update.outputs.build_matrix) }}
    uses: ./.github/workflows/build-openwrt.yml
    with:
      branch: ${{ matrix.branch }}
      profile: ${{ matrix.profile }}
      lan_ip: ${{ inputs.lan_ip || '' }}
      lan_gateway: ${{ inputs.lan_gateway || '10.0.0.253' }}
      lan_netmask: ${{ inputs.lan_netmask || '255.255.255.0' }}
    secrets: inherit

  # ============================================================
  # Step 3: 编译成功后，把源码 hash 回写进仓库（.github/last_commit/）
  #   仅在对应分支编译成功时更新，失败不更新（下次仍会重编）
  # ============================================================
  save-marker:
    name: Update Source Marker
    needs: [check-update, build]
    if: always() && needs.check-update.outputs.has_update == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Save & Push Markers
        env:
          UPDATED: ${{ needs.check-update.outputs.updated }}
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p .github/last_commit

          src_ref() {
            case "$1" in
              v24.10) echo "openwrt-24.10" ;;
              v25.12) echo "openwrt-25.12" ;;
              *)      echo "$1" ;;
            esac
          }

          for B in $UPDATED; do
            REF=$(src_ref "$B")
            H=$(git ls-remote https://github.com/immortalwrt/immortalwrt "refs/heads/$REF" | awk '{print $1}')
            if [ -z "$H" ]; then
              echo "⚠️ $B 未取到 hash，跳过"
              continue
            fi
            printf '%s\n' "$H" > ".github/last_commit/$B.txt"
            echo "✔ $B -> $H"
          done

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/last_commit

          if git diff --cached --quiet; then
            echo "标记无变化，跳过提交"
            exit 0
          fi

          git commit -m "chore(marker): 更新源码标记 [skip ci]"

          for i in 1 2 3; do
            if git pull --rebase --autostash origin "${TARGET_BRANCH:-main}" \
               && git push origin "HEAD:${TARGET_BRANCH:-main}"; then
              echo "✅ 标记推送成功"
              exit 0
            fi
            echo "⚠️ 推送失败，重试 $i/3 ..."
            sleep 5
          done

          echo "❌ 标记推送失败（不影响固件产物）"
          exit 1
